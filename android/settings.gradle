
pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        File localPropsFile = new File(settingsDir, "local.properties")
        if (!localPropsFile.exists()) {
            localPropsFile = new File(settingsDir.parentFile, "local.properties")
        }
        if (!localPropsFile.exists()) {
           //TODO: Throw error
        }
        properties.load(localPropsFile.newDataInputStream())
        def sdkPath = properties.getProperty("flutter.sdk")
        if (sdkPath == null) {
           //TODO: Throw error
        }
        return sdkPath
    }() 

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.1.0" apply false
    id "org.jetbrains.kotlin.android" version "1.8.22" apply false

}


dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url "https://storage.googleapis.com/download.flutter.io" }
    }
}

include ':app'
